<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006f5e">
<title>Billberries Mobile</title>
<style>
:root { font: 16px/1.45 system-ui, -apple-system, sans-serif; color: #192b39; background: #f3f5f4; --green: #006f5e; --yellow: #ffde76; --red: #a63634; --blue: #3c5fa8; --others: #8aa29c; --seeking: #e09a1a; }
* { box-sizing: border-box; }
body { margin: 0; }
button, input, select { font: inherit; }
button { cursor: pointer; }
button:disabled { opacity: .42; cursor: not-allowed; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid #d69a16; outline-offset: 2px; }
.shell { max-width: 680px; margin: auto; padding: 16px 16px 120px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0 16px; }
header strong { font-size: 20px; letter-spacing: -.04em; white-space: nowrap; }
header > div:first-child { min-width: 0; }
header small { display: block; color: #546a75; font-size: 12px; }
h1 { font-size: 27px; line-height: 1.15; letter-spacing: -.05em; margin: 0 0 6px; }
h2 { margin: 0 0 8px; font-size: 20px; }
.muted { color: #5d737d; font-size: 14px; }
.card { background: #fff; border-radius: 20px; box-shadow: 0 8px 30px #213e4510; padding: 18px 20px; margin: 14px 0; }
.subtitle { font-size: 13px; font-weight: 750; text-transform: uppercase; letter-spacing: .07em; color: #526b72; margin: 4px 0 10px; }
.row { display: flex; gap: 8px; align-items: center; }
.grow { flex: 1; }
.icon { border: 0; background: #e4ece9; border-radius: 12px; padding: 10px 13px; color: var(--green); min-width: 44px; min-height: 44px; }
.pill { border: 1px solid #d5dfdd; background: #fff; border-radius: 12px; padding: 10px 14px; min-height: 44px; color: #294253; white-space: nowrap; flex: none; }
.pill.active { background: #e8f5ee; border-color: var(--green); color: var(--green); font-weight: 700; }
.pill { position: relative; }
.pill.has-mine { box-shadow: inset 0 -3px 0 var(--blue); }
.pill.has-others::after { content: ''; position: absolute; left: 50%; bottom: 6px; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--others); }
.pill.has-seeking::after { background: var(--seeking); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: #5d737d; margin: 2px 2px 4px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { display: inline-block; }
.legend .l-mine { width: 14px; height: 3px; background: var(--blue); }
.legend .l-others, .legend .l-seeking { width: 6px; height: 6px; border-radius: 50%; background: var(--others); }
.legend .l-seeking { background: var(--seeking); }
.date-row { display: flex; gap: 8px; overflow-x: auto; padding: 3px 1px 9px; scrollbar-width: thin; }
.date-field { width: 100%; margin-top: 6px; min-height: 44px; border: 1px solid #d5dfdd; border-radius: 12px; background: #fff; padding: 8px; }
.time-head { font-size: 22px; font-weight: 750; letter-spacing: -.02em; margin: 14px 0 0; }
.timeline { display: flex; gap: 4px; overflow-x: auto; scroll-snap-type: x proximity; padding: 10px 2px 12px; scrollbar-width: thin; }
.slot { min-width: 66px; min-height: 68px; display: flex; flex-direction: column; justify-content: center; align-items: center; border: 1px solid #dbe3e1; border-radius: 11px; background: #f5f7f6; scroll-snap-align: center; user-select: none; color: #192b39; }
.slot b { font-size: 15px; }
.slot small { font-size: 11px; color: #5a7376; }
.slot.free { background: #edf8f2; }
.slot.empty { color: #94a1a5; }
.slot.mine { background: #e8eefb; border-color: #9fb3dd; }
.slot.mine small { color: var(--blue); font-weight: 700; }
.slot.sel { background: var(--yellow); border-color: #d6a11b; color: #2c2d25; }
.slot.sel.clash { background: #f6d4d1; border-color: var(--red); }
.controls { display: flex; align-items: center; gap: 8px; justify-content: center; margin: 4px 0; }
.controls span { min-width: 92px; text-align: center; }
.hint { font-size: 12px; color: #637680; text-align: center; }
.table-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 9px; }
.table { border: 1px solid #d7e3df; background: #fafcfb; text-align: left; border-radius: 14px; padding: 12px 13px; min-height: 96px; color: #192b39; }
.table b { font-size: 19px; }
.table small { display: block; color: #5b7076; font-size: 12px; }
.table.free { border-color: var(--green); background: #eff9f3; }
.table.picked { outline: 3px solid var(--green); outline-offset: -1px; }
.badge { display: inline-block; font-size: 11px; background: #d7eee3; color: #07563e; border-radius: 20px; padding: 1px 7px; vertical-align: 2px; }
.list-item { display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #e8efeb; padding: 10px 0; }
.list-item:last-child { border-bottom: 0; }
.list-item .what { flex: 1; min-width: 0; }
.list-item .what b { display: block; }
.list-item.mine .what b { color: var(--blue); }
.linkish { background: none; border: 0; padding: 0; color: var(--green); text-decoration: underline; font: inherit; }
.primary { border: 0; border-radius: 12px; background: var(--yellow); color: #182a32; min-height: 54px; padding: 12px 20px; font-weight: 750; width: 100%; }
.primary:disabled { background: #dce1df; }
.secondary { background: #fff; border: 1px solid #cbd9d5; border-radius: 12px; min-height: 44px; padding: 8px 14px; color: var(--green); }
.secondary.danger { color: var(--red); border-color: #e4c4c0; }
.danger-btn { border: 0; border-radius: 12px; background: var(--red); color: #fff; min-height: 50px; padding: 10px 18px; font-weight: 700; }
.segmented { display: flex; gap: 6px; margin: 10px 0; }
.segmented button { flex: 1; min-height: 50px; border: 1px solid #cbd9d5; border-radius: 12px; background: #fff; color: #294253; }
.segmented button[aria-pressed="true"] { background: #e8f5ee; border-color: var(--green); color: var(--green); font-weight: 700; }
label { display: block; font-weight: 650; font-size: 14px; margin: 12px 0 4px; }
select, input[type=text], input[type=number] { width: 100%; min-height: 44px; padding: 8px 10px; border: 1px solid #cddbd6; border-radius: 11px; background: #fff; }
.order-row { display: grid; grid-template-columns: 26px 64px 1fr 1fr 44px 44px; gap: 6px; align-items: center; margin: 6px 0; }
.order-row input { min-width: 0; }
.order-head { font-size: 12px; color: #5d737d; }
details summary { cursor: pointer; color: var(--green); font-weight: 700; min-height: 32px; }
#notice { min-height: 22px; color: var(--red); font-size: 14px; }
#notice.ok { color: var(--green); }
dialog { border: 0; border-radius: 20px; padding: 0; max-width: min(94vw, 480px); width: 100%; box-shadow: 0 18px 90px #142b3666; }
dialog::backdrop { background: #142b36aa; }
dialog .card { margin: 0; box-shadow: none; }
.big { font-size: 18px; font-weight: 700; margin: 6px 0; }
.foot { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e1e9e5; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); }
.foot > div { max-width: 648px; margin: auto; }
.original { font-size: 13px; text-align: center; margin: 15px 0; }
.original a { color: var(--green); }
.lang { position: relative; display: inline-flex; align-items: center; gap: 5px; min-height: 44px; padding: 6px 10px; border-radius: 12px; border: 1px solid #d5dfdd; background: #fff; color: #294253; font-weight: 650; white-space: nowrap; }
.lang .flag { font-size: 20px; line-height: 1; }
.lang .chev { font-size: 11px; color: #637680; }
.lang select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
.lang:focus-within { outline: 3px solid #d69a16; outline-offset: 2px; }
#bbLogin ol { padding-left: 20px; }
#bbLogin li { margin: 12px 0; }
</style>
</head>
<body>
<main class="shell">
  <header>
    <div><strong>Billberries <span style="color:var(--green)">Mobile</span></strong><small data-i18n="appTagline"></small></div>
    <div class="row">
      <label class="lang"><span class="flag" id="langFlag" aria-hidden="true"></span><span id="langCode" aria-hidden="true"></span><span class="chev" aria-hidden="true">▾</span><select id="language" data-i18n-aria="language"></select></label>
      <button id="refresh" class="icon" type="button" data-i18n-aria="refresh" data-i18n-title="refresh">↻</button>
    </div>
  </header>
  <h1 data-i18n="heading"></h1>
  <p class="muted" id="subtitle" data-i18n="loading"></p>
  <div id="notice" role="status" aria-live="polite"></div>

  <section class="card" id="bbLogin" hidden>
    <h2 data-i18n="loginTitle"></h2>
    <p data-i18n="loginIntro"></p>
    <ol>
      <li><button id="googleOpen" class="primary" type="button" data-i18n="loginOpen"></button>
        <p class="muted" data-i18n-html="loginOpenHint"></p></li>
      <li><span data-i18n="loginCopy"></span>
        <div class="row" style="margin:8px 0"><button id="googlePaste" class="secondary" type="button" data-i18n="loginPaste"></button><span class="muted" data-i18n="loginPasteAlt"></span></div>
        <input id="googleCode" type="text" autocomplete="off" placeholder="https://billberries.de/login/callback#…code=…" data-i18n-aria="loginAddress"></li>
      <li><button id="googleSubmit" class="primary" type="button" data-i18n="loginSubmit"></button></li>
    </ol>
    <p class="muted" id="bbLoginStatus" role="status"></p>
  </section>

  <section class="card" id="mineCard" hidden>
    <div class="subtitle" data-i18n="mineTitle"></div>
    <div id="mineList"></div>
  </section>

  <section class="card">
    <div class="subtitle" data-i18n="dateTitle"></div>
    <div class="date-row" id="dates"></div>
    <div class="legend" aria-hidden="true"><span><i class="l-mine"></i><span data-i18n="legendMine"></span></span><span><i class="l-others"></i><span data-i18n="legendOthers"></span></span><span><i class="l-seeking"></i><span data-i18n="legendSeeking"></span></span></div>
    <input id="dateInput" class="date-field" type="date" data-i18n-aria="datePick">
    <div class="time-head" id="timeHead"></div>
    <div class="timeline" id="timeline" data-i18n-aria="startPick"></div>
    <div class="controls"><button class="icon" id="earlier" type="button" data-i18n-aria="earlier">←</button><span data-i18n="move"></span><button class="icon" id="later" type="button" data-i18n-aria="later">→</button></div>
    <div class="controls"><button class="icon" id="shorter" type="button" data-i18n-aria="shorter">−</button><span id="duration"></span><button class="icon" id="longer" type="button" data-i18n-aria="longer">+</button></div>
    <div class="hint" data-i18n="timeHint"></div>
  </section>

  <section class="card">
    <div class="subtitle" data-i18n="tableTitle"></div>
    <div id="tables" class="table-grid"></div>
    <p class="muted" id="tableHint"></p>
  </section>

  <section class="card" id="dayCard" hidden>
    <div class="subtitle" id="dayTitle"></div>
    <div id="dayList" class="muted"></div>
  </section>

  <section class="card">
    <details id="settings">
      <summary data-i18n="settingsSummary"></summary>
      <p class="muted" data-i18n="settingsIntro"></p>
      <label for="prefSize" data-i18n="prefSize"></label><select id="prefSize"></select>
      <label for="prefCloth" data-i18n="prefCloth"></label><select id="prefCloth"></select>
      <label data-i18n="orderTitle"></label>
      <div class="order-row order-head"><span>#</span><span data-i18n="colTable"></span><span data-i18n="colSize"></span><span data-i18n="colCloth"></span><span></span><span></span></div>
      <div id="orderList"></div>
      <label for="calendarReminder" data-i18n="calendarReminderLabel"></label>
      <input id="calendarReminder" type="number" min="0" max="10080" step="1" inputmode="numeric" aria-describedby="calendarReminderHint">
      <p class="muted" id="calendarReminderHint" data-i18n="calendarReminderHint"></p>
      <label data-i18n="notifyTitle"></label>
      <p class="muted" id="notifyInfo"></p>
      <div class="row"><button id="scanNow" class="secondary" type="button" data-i18n="scanNow"></button><button id="testMail" class="secondary" type="button" data-i18n="testMail"></button></div>
    </details>
  </section>

  <p class="original"><a href="https://billberries.de/reservation/billard/0001/" target="_blank" rel="noopener" data-i18n="original"></a> · <span id="session"></span> · <button id="bbLogout" class="linkish" type="button" data-i18n="logout"></button></p>
</main>

<div class="foot"><div><button id="book" class="primary" type="button" disabled data-i18n="loading"></button></div></div>

<dialog id="modal" aria-labelledby="modalTitle">
  <div class="card">
    <div class="row"><h2 id="modalTitle" class="grow"></h2><button class="icon" id="modalClose" type="button" data-i18n-aria="close">✕</button></div>
    <div id="modalBody"></div>
  </div>
</dialog>

      ...Object.entries(LANGUAGES).map(([code, name]) => new Option(`${flagFor(code)} ${name}`.trim(), code)));
    select.value = saved;
    // Closed state: just flag and language code; the open native list shows full names.
    document.getElementById('langFlag').textContent = flagFor(lang) || '🌐';
    document.getElementById('langCode').textContent = lang.toUpperCase();
  }

  // ---------- helpers ----------
  const SLOT = 1800;
  const HEADERS = { 'X-Requested-With': 'billberries-mobile' };
  const $ = id => document.getElementById(id);
  const el = (tagName, props = {}, ...children) => {
    const node = Object.assign(document.createElement(tagName), props);
    node.append(...children.filter(c => c != null && c !== false));
    return node;
  };
  const berlinDate = new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Berlin', year: 'numeric', month: '2-digit', day: '2-digit' });
  const berlinClock = new Intl.DateTimeFormat('de-DE', { timeZone: 'Europe/Berlin', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }); // for logic, not display
  const dateKey = ms => berlinDate.format(new Date(ms));
  const hhmm = epoch => timeFmt.format(new Date(epoch * 1000));
  const longDay = key => dayFmt.format(new Date(key + 'T12:00:00Z'));
  const dayLabel = key => key === dateKey(Date.now()) ? t('today') : key === dateKey(Date.now() + 864e5) ? t('tomorrow') : longDay(key);
  const norm = s => String(s || '').replace(/\s+/g, '').toLowerCase();
  const nowEpoch = () => Date.now() / 1000;
  const shown = lines => lines.filter(l => l !== 'None').map(bbText).join(' · ');

  const state = {
    days: new Map(), date: dateKey(Date.now()), start: null, len: 6, table: null, // 6 × 30 min = 3 h
    busy: false, seq: 0, me: null, settings: null, status: null,
  };

  // ---------- server API ----------
  class LoginNeeded extends Error {}
  async function api(path, options = {}) {
    const r = await fetch(path, { credentials: 'same-origin', cache: 'no-store', ...options, headers: { ...HEADERS, ...(options.headers || {}) } });
    if (r.status === 401) { showLogin(true); throw new LoginNeeded(t('errLoginNeeded')); }
    if (!r.ok) {
      let body = {};
      try { body = await r.json(); } catch {}
      const key = 'err.' + body.code;
      throw new Error(I18N[lang][key] || I18N.en[key] ? t(key, body.params || {}) : body.code ? t('errRequest', { code: body.code }) : t('errServer', { status: r.status }));
    }
    return r;
  }
  const getJSON = async path => (await api(path)).json();
  const postJSON = async (path, body) => (await api(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })).json();
  async function billberriesPage(path, form) {
    const options = form ? { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: new URLSearchParams(form) } : {};
    const response = await api(path, options);
    const doc = new DOMParser().parseFromString(await response.text(), 'text/html');
    doc.calendarMail = response.headers.get('X-BBM-Calendar-Mail');
    return doc;
  }
  const reservationForm = fields => billberriesPage('api/reservation', fields);

  function notice(message, ok = false) { $('notice').textContent = message || ''; $('notice').className = ok ? 'ok' : ''; }
  function error(e) { if (e instanceof LoginNeeded) return; notice(e.message || String(e)); console.error('Billberries Mobile:', e); }

  // ---------- calendar ----------
  function parseCalendar(doc) {
    if (doc.querySelector('#login_google')) { showLogin(true); throw new LoginNeeded(t('errLoginNeeded')); }
    const days = new Map();
    let day = null;
    for (const cell of doc.querySelectorAll('.bb_rs_table_cell')) {
      const m = (cell.getAttribute('style') || '').match(/grid-area:\s*(\d+)\s*\/\s*(\d+)\s*\/\s*span\s*(\d+)/);
      if (!m) continue;
      const grid = +m[1], col = +m[2], span = +m[3];
      const inner = cell.firstElementChild, cls = inner?.className || '';
      if (cls.includes('rs-col-header1')) {
        const d = cell.textContent.match(/(\d{2})\.(\d{2})\.(\d{4})/);
        if (d) { day = { key: `${d[3]}-${d[2]}-${d[1]}`, grid: new Map(), free: new Map(), bookings: [], slots: [] }; days.set(day.key, day); }
        continue;
      }
      if (!day) continue;
      if (col === 1) { if (cls.includes('rs-row-header')) day.grid.set(grid, { epoch: null, row: null }); continue; }
      const id = (cell.id || '').match(/^(\d+)_(B\d{2})$/);
      const click = (cell.getAttribute('onclick') || '').match(/doReservation\('(B\d{2})','(\d+)'\)/);
      if (!id || !click || !day.grid.has(grid)) continue; // past slots ("too late") have neither
      const epoch = +id[1], table = id[2], row = +click[2];
      for (let k = 0; k < span; k++) {
        const g = day.grid.get(grid + k);
        if (g && g.epoch === null) { g.epoch = epoch + k * SLOT; g.row = row + k; }
      }
      if (cls.includes('rs-item-booked')) {
        const lines = [...inner.childNodes].filter(n => n.nodeType === Node.TEXT_NODE).map(n => n.textContent.trim()).filter(Boolean);
        day.bookings.push({ day: day.key, table, row, epoch, end: epoch + span * SLOT, lines });
      } else if (cls.includes('rs-item-not-booked')) {
        if (!day.free.has(row)) day.free.set(row, new Set());
        day.free.get(row).add(table);
      }
    }
    for (const d of days.values()) d.slots = [...d.grid.values()].filter(g => g.epoch !== null).sort((a, b) => a.epoch - b.epoch);
    if (!days.size) throw new Error(t('errCalendar'));
    return days;
  }
  const allBookings = () => [...state.days.values()].flatMap(d => d.bookings);
  const isSeeking = b => b.lines.includes('Suche Spielpartner');
  const isMine = b => !!state.me && b.lines.slice(0, 2).some(line => norm(line) === norm(state.me.name));
  const myBookings = () => allBookings().filter(isMine).filter(b => b.end > nowEpoch()).sort((a, b) => a.epoch - b.epoch);
  const currentDay = () => state.days.get(state.date);
  const slots = () => currentDay()?.slots || [];
  const startIndex = () => slots().findIndex(s => s.epoch === state.start);

  function interval(i = startIndex(), len = state.len) {
    const s = slots();
    if (i < 0 || i + len > s.length) return null;
    for (let k = 1; k < len; k++) if (s[i + k].epoch !== s[i].epoch + k * SLOT) return null;
    return { start: s[i].epoch, end: s[i].epoch + len * SLOT, rows: s.slice(i, i + len).map(x => x.row) };
  }
  const overlaps = (a, b) => a.start < b.end && b.epoch < a.end;
  const isFree = (tableId, i, len) => { const iv = interval(i, len); return !!iv && iv.rows.every(r => currentDay().free.get(r)?.has(tableId)); };
  const myClash = (i, len) => { const iv = interval(i, len); return iv ? allBookings().filter(isMine).find(b => overlaps(iv, b)) : null; };

  // ---------- table preferences ----------
  const tables = () => state.settings.tables;
  const tableById = id => tables().find(x => x.id === id);
  const tableName = id => t('tableName', { n: tableById(id)?.number ?? id });
  const prop = value => value || t('unknown');
  const score = x => (state.settings.size && x.size === state.settings.size ? 2 : 0) + (state.settings.cloth && x.cloth === state.settings.cloth ? 1 : 0);
  const byPreference = (a, b) => score(b) - score(a) || state.settings.order.indexOf(a.id) - state.settings.order.indexOf(b.id);
  const freeTables = (i, len) => tables().filter(x => isFree(x.id, i, len)).sort(byPreference);
  let saveTimer;
  function saveSettings() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try { await postJSON('api/settings', state.settings); } catch (e) { error(e); }
    }, 500);
  }

  // ---------- selection ----------
  function ensureSelection() {
    const s = slots();
    if (!s.length) { state.start = null; state.table = null; return; }
    if (!s.some(x => x.epoch === state.start)) {
      // "Tonight" by default: from 18:00, or from now if later.
      const evening = s.find(x => berlinClock.format(new Date(x.epoch * 1000)) >= '18:00')?.epoch ?? s[0].epoch;
      const from = Math.max(evening, nowEpoch() - SLOT);
      const bookable = i => freeTables(i, state.len).length && !myClash(i, state.len);
      const i = s.findIndex((x, k) => x.epoch >= from && bookable(k));
      const j = i >= 0 ? i : s.findIndex((x, k) => bookable(k));
      state.start = s[j >= 0 ? j : 0].epoch;
    }
    if (!state.table || !isFree(state.table, startIndex(), state.len)) state.table = freeTables(startIndex(), state.len)[0]?.id || null;
  }
  function hasBookable(key) {
    const current = state.date;
    state.date = key;
    const ok = slots().some((x, i) => freeTables(i, state.len).length && !myClash(i, state.len));
    state.date = current;
    return ok;
  }
  function selectDate(key, epoch = null) {
    if (!state.days.has(key)) { notice(t('errOutOfRange')); return; }
    state.date = key; state.start = epoch; state.table = null;
    render(); scrollToSelection();
  }
  function scrollToSelection() { $('timeline').children[startIndex()]?.scrollIntoView({ block: 'nearest', inline: 'center' }); }

  // ---------- rendering ----------
  function bookingRow(b, { showDay }) {
    const mine = isMine(b);
    const when = `${showDay ? dayLabel(b.day) + ' · ' : ''}${hhmm(b.epoch)}–${hhmm(b.end)} · ${tableName(b.table)}`;
    const what = el('div', { className: 'what' }, el('b', { textContent: when }), el('span', { className: 'muted', textContent: shown(b.lines) }));
    if (showDay) { what.style.cursor = 'pointer'; what.onclick = () => selectDate(b.day, b.epoch); }
    const cancel = mine && b.end > nowEpoch() ? el('button', { className: 'secondary danger', type: 'button', textContent: t('cancel'), onclick: () => cancelBooking(b) }) : null;
    return el('div', { className: 'list-item' + (mine ? ' mine' : '') }, what, cancel);
  }

  function render() {
    if (!state.settings) return;
    ensureSelection();
    const keys = [...state.days.keys()];
    const upcoming = allBookings().filter(b => b.end > nowEpoch());
    const dayInfo = k => {
      const day = upcoming.filter(b => b.day === k), others = day.filter(b => !isMine(b));
      return { mine: day.length > others.length, others: others.length, seeking: others.some(isSeeking) };
    };
    $('dates').replaceChildren(...keys.map(k => {
      const info = dayInfo(k);
      const notes = [info.mine && t('dayMine'), info.others && tn('dayOthers', info.others), info.seeking && t('daySeeking')].filter(Boolean);
      const pill = el('button', { type: 'button', textContent: dayLabel(k), onclick: () => selectDate(k),
        className: 'pill' + (k === state.date ? ' active' : '') + (info.mine ? ' has-mine' : '') + (info.others ? ' has-others' : '') + (info.seeking ? ' has-seeking' : '') });
      if (notes.length) { pill.title = notes.join(', '); pill.setAttribute('aria-label', `${dayLabel(k)} – ${notes.join(', ')}`); }
      return pill;
    }));
    $('dateInput').min = keys[0] || ''; $('dateInput').max = keys.at(-1) || ''; $('dateInput').value = state.date;

    const s = slots(), i = startIndex(), iv = interval(), clash = myClash(i, state.len);
    $('timeHead').textContent = iv ? t('timeRange', { day: dayLabel(state.date), from: hhmm(iv.start), to: hhmm(iv.end) }) : t(s.length ? 'noFit' : 'noTimes');
    $('duration').textContent = t('minutes', { n: state.len * 30 });
    $('earlier').disabled = i <= 0; $('later').disabled = i < 0 || i >= s.length - 1;
    $('shorter').disabled = state.len <= 1; $('longer').disabled = state.len >= 8;

    const mineAt = epoch => allBookings().filter(isMine).find(b => b.epoch <= epoch && epoch < b.end);
    const scroll = $('timeline').scrollLeft;
    $('timeline').replaceChildren(...s.map((slot, k) => {
      const own = mineAt(slot.epoch), count = freeTables(k, 1).length, selected = iv && slot.epoch >= iv.start && slot.epoch < iv.end;
      return el('button', {
        type: 'button', className: 'slot' + (own ? ' mine' : count ? ' free' : ' empty') + (selected ? ' sel' : '') + (selected && clash ? ' clash' : ''),
        title: own ? t('slotYouTitle', { table: tableName(own.table) }) : t('slotFreeTitle', { n: count }),
        onclick: () => { state.start = slot.epoch; render(); },
      }, el('b', { textContent: hhmm(slot.epoch) }), el('small', { textContent: own ? t('slotYou', { n: tableById(own.table)?.number }) : t('slotFree', { n: count }) }));
    }));
    $('timeline').scrollLeft = scroll;

    const free = new Set(freeTables(i, state.len).map(x => x.id));
    const ranked = [...tables()].sort(byPreference);
    $('tables').replaceChildren(...ranked.map((x, k) => el('button', {
      type: 'button', disabled: !free.has(x.id),
      className: 'table' + (free.has(x.id) ? ' free' : '') + (state.table === x.id ? ' picked' : ''),
      onclick: () => { state.table = x.id; render(); },
    }, el('b', { textContent: tableName(x.id) + ' ' }), k === 0 ? el('span', { className: 'badge', textContent: t('favorite') }) : null,
       el('small', { textContent: `${prop(x.size)} · ${prop(x.cloth)}` }), el('small', { textContent: t(free.has(x.id) ? 'free' : 'booked') }))));
    $('tableHint').textContent = !iv ? '' : clash ? t('hintClash', { table: tableName(clash.table), from: hhmm(clash.epoch), to: hhmm(clash.end) })
      : free.size ? t('hintFree', { free: free.size, total: tables().length }) : t('hintNone');

    const mine = myBookings();
    $('mineCard').hidden = !mine.length;
    $('mineList').replaceChildren(...mine.map(b => bookingRow(b, { showDay: true })));
    const today = (currentDay()?.bookings || []).filter(b => b.end > nowEpoch()).sort((a, b) => a.epoch - b.epoch);
    $('dayTitle').textContent = t('dayTitle', { day: dayLabel(state.date) });
    $('dayCard').hidden = !today.length; // all reservations of the selected day (anyone's); omitted when there are none
    $('dayList').replaceChildren(...today.map(b => bookingRow(b, { showDay: false })));

    const book = $('book');
    book.disabled = state.busy || !iv || !!clash || !state.table;
    book.textContent = state.busy ? t('bookWait') : !iv ? t('bookPickTime') : clash ? t('bookClash')
      : !state.table ? t('bookNoTable') : t('bookAction', { table: tableName(state.table), from: hhmm(iv.start), to: hhmm(iv.end) });
    if (state.days.size) $('subtitle').textContent = t('asOf', { time: timeFmt.format(new Date()), n: state.days.size });
  }

  function renderSettings() {
    const s = state.settings;
    const options = (select, values, current) => {
      select.replaceChildren(new Option(t('any'), ''), ...[...new Set(values.filter(Boolean))].map(v => new Option(v, v)));
      select.value = current || '';
    };
    options($('prefSize'), tables().map(x => x.size), s.size);
    options($('prefCloth'), tables().map(x => x.cloth), s.cloth);
    $('calendarReminder').value = s.calendarReminderMinutes ?? 60;
    const move = (k, delta) => { const o = s.order; [o[k], o[k + delta]] = [o[k + delta], o[k]]; changed(); };
    $('orderList').replaceChildren(...s.order.map((id, k) => {
      const x = tableById(id);
      const input = (key, label) => {
        const field = el('input', { type: 'text', value: x[key], placeholder: t('unknown'), onchange: e => { x[key] = e.target.value.trim(); changed(); } });
        field.setAttribute('aria-label', t(label, { n: x.number }));
        return field;
      };
      const arrow = (text, label, delta, disabled) => {
        const b = el('button', { className: 'icon', type: 'button', textContent: text, disabled, onclick: () => move(k, delta) });
        b.setAttribute('aria-label', t(label, { n: x.number }));
        return b;
      };
      return el('div', { className: 'order-row' }, el('span', { className: 'muted', textContent: `${k + 1}.` }), el('b', { textContent: String(x.number) }),
        input('size', 'sizeOf'), input('cloth', 'clothOf'), arrow('↑', 'up', -1, k === 0), arrow('↓', 'down', 1, k === s.order.length - 1));
    }));
  }
  function changed() { state.table = null; saveSettings(); renderSettings(); render(); }

  function renderNotify() {
    const n = state.status?.notify;
    if (!n) return;
    const when = epoch => new Intl.DateTimeFormat(tag, { timeZone: 'Europe/Berlin', weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }).format(new Date(epoch * 1000));
    const lines = [n.configured ? t('notifyOn', { to: n.to.join(', ') }) : t('notifyOff')];
    if (n.configured) lines.push(t('calendarRecipient', { to: n.to.join(', ') }));
    if (n.nextScanAt) lines.push(t('notifyNext', { when: when(n.nextScanAt) }));
    if (n.lastScan?.at) lines.push(n.lastScan.loggedIn === false ? `${t('notifyLast', { when: when(n.lastScan.at), open: '–', new: '–' })} (${t('errLoginNeeded')})`
      : t('notifyLast', { when: when(n.lastScan.at), open: n.lastScan.open, new: n.lastScan.new }));
    $('notifyInfo').replaceChildren(...lines.flatMap((line, i) => i ? [el('br'), line] : [line]));
    $('testMail').disabled = !n.configured;
  }
  async function refreshStatus() { try { state.status = await getJSON('api/status'); renderSession(); renderNotify(); } catch {} }
  function renderSession() {
    const s = state.status;
    if (!s) return;
    const who = [s.user, state.me?.name && `(${state.me.name})`].filter(Boolean).join(' ') || t('loggedIn');
    $('session').textContent = !s.loggedIn ? t('sessionOut') : s.loginAt ? t('sessionSince', { who, date: dateOnlyFmt.format(new Date(s.loginAt * 1000)) }) : t('session', { who });
  }

  // ---------- dialogs ----------
  function sheet(title, build) {
    return new Promise(resolve => {
      const modal = $('modal');
      let settled = false;
      const done = value => { if (settled) return; settled = true; resolve(value); if (modal.open) modal.close(); };
      $('modalTitle').textContent = title;
      $('modalBody').replaceChildren(build(done));
      modal.onclose = () => done(null);
      modal.showModal();
    });
  }
  const confirmSheet = (title, details, keepLabel, goLabel) => sheet(title, done => el('div', {}, ...details,
    el('div', { className: 'row' }, el('button', { className: 'secondary grow', type: 'button', textContent: keepLabel, onclick: () => done(false) }),
      el('button', { className: 'danger-btn grow', type: 'button', textContent: goLabel, onclick: () => done(true) }))));
  function dialogData(doc) {
    const script = [...doc.scripts].map(x => x.textContent).join('\n');
    const find = re => { const v = script.match(re)?.[1]; if (!v) throw new Error(t('errForm')); return v; };
    const options = sel => [...(doc.querySelector(sel)?.options || [])].map(o => ({ id: o.value, name: o.textContent.trim(), selected: o.selected }));
    return {
      match: find(/getElementById\(["']rsMatchID["']\)\.value\s*=\s*["']([a-f0-9-]+)["']/),
      start: Number(find(/getElementById\(["']rowIdx["']\)\.value\s*=\s*(\d+)/)),
      p1: doc.querySelector('#player1Select')?.value,
      p1Name: doc.querySelector('#player1Select')?.selectedOptions?.[0]?.textContent?.trim(),
      p2: doc.querySelector('#player2Select')?.value,
      mp: doc.querySelector('#mpSelect')?.value,
      end: options('#endSlotSelect'),

      canCancel: !!doc.querySelector('#cancelReservation'),

  }
  function busy(on) { state.busy = on; render(); }

  async function book() {
    const iv = interval(), x = tableById(state.table);
    if (!iv || !x || myClash(startIndex(), state.len)) return;
    busy(true); notice(t('checking'));
    try {
      const d = dialogData(await reservationForm({ tableID: x.id, rowIdx: String(iv.rows[0]) }));
      const last = String(iv.rows.at(-1));
      if (!d.canNew || d.start !== iv.rows[0]) throw new Error(t('errTaken'));
      if (!d.end.some(o => o.id === last)) throw new Error(t('errDuration'));
      if (!d.p1 || d.p1.startsWith('response_request_')) throw new Error(t('errNoPlayer'));
      notice('');
      const choice = await sheet(t('bookTitle'), done => {
        let mode = 'billard_training1';
        const partners = d.players.filter(p => p.name && !p.id.endsWith('NotSelected') && p.id !== d.p1);
        const partner = el('input', { type: 'text', placeholder: t('partnerPlaceholder'), autocomplete: 'off' });
        partner.setAttribute('list', 'partnerList');
        const partnerBox = el('div', { hidden: true }, el('label', { textContent: t('partner') }), partner,
          el('datalist', { id: 'partnerList' }, ...partners.map(p => el('option', { value: p.name }))),
          el('p', { className: 'muted', textContent: t('partnerHint') }));
        const solo = el('button', { type: 'button', textContent: t('solo') });
        const duo = el('button', { type: 'button', textContent: t('duo') });
        const pick = m => { mode = m; solo.setAttribute('aria-pressed', m === 'billard_training1'); duo.setAttribute('aria-pressed', m !== 'billard_training1'); partnerBox.hidden = m === 'billard_training1'; if (!partnerBox.hidden) partner.focus(); };
        solo.onclick = () => pick('billard_training1'); duo.onclick = () => pick('billard_training2'); pick(mode);
        const go = el('button', { className: 'primary', type: 'button', textContent: t('bookNow'), onclick: () => {
          if (mode === 'billard_training1') return done({ mode });
          const p = partners.find(q => norm(q.name) === norm(partner.value));
          if (!p) { partner.setCustomValidity(t('partnerInvalid')); partner.reportValidity(); return; }
          done({ mode, partner: p });
        } });
        partner.oninput = () => partner.setCustomValidity('');
        return el('div', {}, el('p', { className: 'big', textContent: `${dayLabel(state.date)} · ${hhmm(iv.start)}–${hhmm(iv.end)}` }),
          el('p', { className: 'muted', textContent: t('tableInfo', { n: x.number, size: prop(x.size), cloth: prop(x.cloth) }) }),
          el('div', { className: 'segmented' }, solo, duo), partnerBox, go);
      });
      if (!choice) return;
      notice(t('booking'));
      const result = await reservationForm({ whatHasChanged: 'updateReservation', newValue: 'New', tableID: x.id, rowIdx: String(d.start), rowIdxTo: last,
        rsMatchID: d.match, player1ID: d.p1, player2ID: choice.partner?.id || '', mpID: choice.mode });
      await load();
      const ok = allBookings().some(b => b.table === x.id && b.epoch === iv.start && b.lines.slice(0, 2).some(l => norm(l) === norm(d.p1Name)));
      const mailKey = { sent: 'calendarMailSent', failed: 'calendarMailFailed', 'not-configured': 'calendarMailOff', unconfirmed: 'calendarMailUnconfirmed' }[result.calendarMail];
      const message = ok ? t('bookedOk', { table: tableName(x.id), day: dayLabel(state.date), from: hhmm(iv.start), to: hhmm(iv.end) }) : t('bookUnconfirmed');
      notice([message, mailKey && t(mailKey)].filter(Boolean).join(' '), ok && (!mailKey || result.calendarMail === 'sent'));
    } catch (e) { error(e); } finally { busy(false); }
  }

  async function cancelBooking(b) {
    const yes = await confirmSheet(t('cancelTitle'), [
      el('p', { className: 'big', textContent: `${dayLabel(b.day)} · ${hhmm(b.epoch)}–${hhmm(b.end)} · ${tableName(b.table)}` }),
      el('p', { className: 'muted', textContent: shown(b.lines) })], t('keep'), t('cancelConfirm'));
    if (!yes) return;
    busy(true); notice(t('cancelling'));
    try {
      const d = dialogData(await reservationForm({ tableID: b.table, rowIdx: String(b.row) }));
      if (!d.canCancel) throw new Error(t('errCannotCancel'));
      const end = d.end.find(o => o.selected)?.id;
      if (!end) throw new Error(t('errEndUnknown'));
      await reservationForm({ whatHasChanged: 'updateReservation', newValue: 'Cancel', tableID: b.table, rowIdx: String(d.start), rowIdxTo: end,
        rsMatchID: d.match, player1ID: d.p1, player2ID: d.p2 || '', mpID: d.mp });
      await load();
      const gone = !allBookings().some(x => x.table === b.table && x.epoch === b.epoch);
      notice(gone ? t('cancelledOk') : t('cancelUnconfirmed'), gone);
    } catch (e) { error(e); } finally { busy(false); }
  }

  // ---------- loading & login ----------
  async function load() {
    const seq = ++state.seq;
    $('refresh').disabled = true;
    try {
      const days = parseCalendar(await billberriesPage('api/calendar'));
      if (seq !== state.seq) return;
      state.days = days;
      showLogin(false);
      if (!days.has(state.date) || (!state.start && !hasBookable(state.date))) {
        // e.g. late in the evening: start with the first day that still has a bookable interval
        state.date = [...days.keys()].find(hasBookable) || [...days.keys()][0];
      }
      if (!state.me) { try { state.me = (await getJSON('api/me')).player; } catch (e) { if (!(e instanceof LoginNeeded)) console.warn(e); } }
      render();
      refreshStatus();
    } catch (e) { error(e); } finally { $('refresh').disabled = false; render(); }
  }
  function showLogin(on) { $('bbLogin').hidden = !on; if (on) $('subtitle').textContent = t('errLoginNeeded'); }

  $('googleOpen').onclick = async () => {
    const tab = window.open('about:blank', '_blank');
    try { const { url } = await getJSON('api/google-url'); if (tab) tab.location = url; else location.href = url; $('bbLoginStatus').textContent = t('loginAfterOpen'); }
    catch (e) { if (tab) tab.close(); $('bbLoginStatus').textContent = e.message; }
  };
  $('googlePaste').onclick = async () => {
    try { $('googleCode').value = await navigator.clipboard.readText(); }
    catch { $('bbLoginStatus').textContent = t('loginPasteDenied'); $('googleCode').focus(); }
  };
  $('googleSubmit').onclick = async () => {
    const button = $('googleSubmit'); button.disabled = true; $('bbLoginStatus').textContent = t('loginBusy');
    try {
      const r = await postJSON('api/google-code', { text: $('googleCode').value });
      $('googleCode').value = ''; $('bbLoginStatus').textContent = ''; state.me = null;
      showLogin(false); notice(t('loginDone', { user: r.user || 'Billberries' }), true); await load();
    } catch (e) { $('bbLoginStatus').textContent = e.message; } finally { button.disabled = false; }
  };
  $('bbLogout').onclick = async () => {
    if (!await confirmSheet(t('logoutTitle'), [el('p', { textContent: t('logoutText') })], t('keep'), t('remove'))) return;
    try { await api('api/billberries-logout', { method: 'POST' }); state.me = null; state.days = new Map(); showLogin(true); render(); state.status = await getJSON('api/status'); renderSession(); } catch (e) { error(e); }
  };

  $('language').onchange = e => {
    const choice = e.target.value;
    if (choice) localStorage.setItem(LOCALE_KEY, choice); else localStorage.removeItem(LOCALE_KEY);
    setLocale(choice); applyStatic(); notice('');
    if (state.settings) renderSettings();
    render(); renderSession(); renderNotify();
  };
  $('scanNow').onclick = async () => {
    const button = $('scanNow'); button.disabled = true; notice('');
    try {
      const r = await postJSON('api/admin/scan', {});
      if (!r.loggedIn) { showLogin(true); notice(t('errLoginNeeded')); }
      else notice([t('scanDone', { open: r.open, new: r.new }), r.mailed && t('scanMailed'), r.error && t('err.' + r.error, { reason: '' })].filter(Boolean).join(' '), !r.error);
      await refreshStatus();
    } catch (e) { error(e); } finally { button.disabled = false; }
  };
  $('testMail').onclick = async () => {
    const button = $('testMail'); button.disabled = true; notice('');
    try { const r = await postJSON('api/admin/test-mail', {}); notice(t('testMailSent', { to: r.to.join(', ') }), true); }
    catch (e) { error(e); } finally { button.disabled = false; }
  };
  $('refresh').onclick = () => { notice(''); load(); };
  $('book').onclick = book;
  $('modalClose').onclick = () => $('modal').close();
  $('dateInput').onchange = e => selectDate(e.target.value);
  const step = delta => { const i = startIndex(), s = slots(); if (s[i + delta]) { state.start = s[i + delta].epoch; render(); scrollToSelection(); } };
  $('earlier').onclick = () => step(-1);
  $('later').onclick = () => step(1);
  $('shorter').onclick = () => { state.len = Math.max(1, state.len - 1); render(); };
  $('longer').onclick = () => { state.len = Math.min(8, state.len + 1); render(); };
  $('prefSize').onchange = e => { state.settings.size = e.target.value; changed(); };
  $('prefCloth').onchange = e => { state.settings.cloth = e.target.value; changed(); };
  $('calendarReminder').onchange = e => {
    if (!e.target.reportValidity() || e.target.value === '') {
      e.target.value = state.settings.calendarReminderMinutes ?? 60;
      return;
    }
    state.settings.calendarReminderMinutes = Number(e.target.value);
    saveSettings();
  };

  setLocale(localStorage.getItem(LOCALE_KEY) || '');
  applyStatic();
  (async () => {
    try { state.settings = await getJSON('api/settings'); } catch (e) { error(e); return; }
    renderSettings();
    await load();
    scrollToSelection();
  })();
})();
</script>
</body>
</html>
